<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleBank - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary"><div class="container">
  <a class="navbar-brand" href="dashboard.html">SimpleBank</a>
  <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
</div></nav>
<main class="container py-4">
  <h2>Welcome, Arun</h2><p class="text-muted">Practice Banking Dashboard</p>
  <div class="row g-3">
    <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
      <h5>Checking Account</h5><p>****0001</p><h3 id="checkingBalance"></h3>
    </div></div></div>
    <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
      <h5>Savings Account</h5><p>****0002</p><h3 id="savingsBalance"></h3>
    </div></div></div>
  </div>
  <div class="my-4 d-flex flex-wrap gap-2">
    <a class="btn btn-primary" href="transfer.html">Transfer Money</a>
    <a class="btn btn-secondary" href="transactions.html">Transactions</a>
    <a class="btn btn-outline-primary" href="beneficiary.html">Beneficiaries</a>
    <button id="depositBtn" class="btn btn-success">Deposit $100</button>
    <button id="withdrawBtn" class="btn btn-warning">Withdraw $100</button>
  </div>
  <div id="dashboardMessage" class="alert d-none"></div>
  <h4>Recent Transactions</h4>
  <div class="table-responsive"><table class="table table-striped">
    <thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Amount</th></tr></thead>
    <tbody id="recentTransactions"></tbody>
  </table></div>
</main>
<script src="js/common.js"></script><script src="js/dashboard.js"></script>
</body></html>
