<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleBank - Transactions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="dashboard.html">SimpleBank</a></div></nav>
<main class="container py-4">
  <h2>Transaction History</h2>
  <div class="row g-2 mb-3">
    <div class="col-md-6"><input id="searchTransaction" class="form-control" placeholder="Search description"></div>
    <div class="col-md-3"><select id="typeFilter" class="form-select"><option value="All">All</option><option>Credit</option><option>Debit</option></select></div>
  </div>
  <div class="table-responsive"><table class="table table-striped">
    <thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Amount</th></tr></thead><tbody id="transactionTable"></tbody>
  </table></div>
  <a href="dashboard.html" class="btn btn-outline-primary">Back to Dashboard</a>
</main>
<script src="js/common.js"></script><script src="js/transactions.js"></script>
</body></html>
