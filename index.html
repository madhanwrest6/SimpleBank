<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleBank - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<div class="container">
  <div class="row justify-content-center mt-5"><div class="col-md-5">
    <div class="card shadow"><div class="card-body p-4">
      <h2 class="text-center">SimpleBank</h2><p class="text-center text-muted">Online Banking Login</p>
      <form id="loginForm">
        <div class="mb-3"><label for="username" class="form-label">Username</label>
          <input id="username" class="form-control" required></div>
        <div class="mb-3"><label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" required></div>
        <button class="btn btn-primary w-100">Login</button>
        <div id="errorMessage" class="text-danger mt-3" role="alert"></div>
      </form>
      <small class="d-block mt-3 text-muted">Practice login: admin / admin123</small>
    </div></div>
  </div></div>
</div>
<script src="js/common.js"></script><script src="js/login.js"></script>
</body></html>
