<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleBank - Transfer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="dashboard.html">SimpleBank</a></div></nav>
<main class="container py-4"><div class="row justify-content-center"><div class="col-md-7">
  <h2>Balance Transfer</h2>
  <div class="card shadow-sm"><div class="card-body">
    <form id="transferForm">
      <div class="mb-3"><label class="form-label">From Account</label>
        <select id="fromAccount" class="form-select" required><option value="checking">Checking</option><option value="savings">Savings</option></select></div>
      <div class="mb-3"><label class="form-label">To Account</label>
        <select id="toAccount" class="form-select" required><option value="savings">Savings</option><option value="checking">Checking</option></select></div>
      <div class="mb-3"><label class="form-label">Amount</label>
        <input id="amount" type="number" min="0.01" step="0.01" class="form-control" required></div>
      <button class="btn btn-primary">Transfer</button>
      <a class="btn btn-link" href="dashboard.html">Back</a>
    </form>
    <div id="message" class="mt-3"></div>
  </div></div>
</div></div></main>
<script src="js/common.js"></script><script src="js/transfer.js"></script>
</body></html>
